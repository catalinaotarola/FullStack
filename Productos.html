<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasExpress - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/ESTILOS.css">
</head>
<body>

    <nav id="navbar-gasexpress"></nav>

    <section class="section-header text-center py-4">
        <div class="container py-3">
            <h1 class="fw-bold">Nuestros Productos</h1>
            <p class="lead mb-0">Selecciona el tamaño ideal para tu casa o negocio</p>
        </div>
    </section>

    <main class="container py-5">
        <!-- Catálogo completo, renderizado por js/productos.js -->
        <div class="row g-4 justify-content-center" id="contenedorProductos">
            <!-- Contenido generado dinámicamente -->
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="row g-4">
                <div class="col-md-6">
                   <h5 class="fw-bold mb-3"><span class="logo-gas">Gas</span>Express</h5>
                    <p>Distribuidora de gas por la Quinta Región. Llevando energía y calor a cada rincón de tu hogar.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h5 class="fw-bold mb-3">Contacto</h5>
                    <p class="mb-1">📩 gasexpress@gmail.com</p>
                    <p class="mb-0">📍 Valparaíso, Chile</p>
                </div>
            </div>
            <hr class="my-4 border-light opacity-25">
            <p class="text-center mb-0 small">&copy; 2026 GasExpress. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/carrito.js"></script>

</html>
